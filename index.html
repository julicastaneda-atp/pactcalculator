<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PACT Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo } = React;

        const App = () => {
            const [selections, setSelections] = useState({ pain: null, authority: null, capital: null, timeline: null });

            const pactData = {
                pain: [
                    { id: 'p1', label: 'Validated pain / Current challenge articulated', points: 35 },
                    { id: 'p2', label: 'No clear pain / Just exploring', points: 0 }
                ],
                authority: [
                    { id: 'a1', label: 'C-Level', points: 20 },
                    { id: 'a2', label: 'Vice President', points: 16 },
                    { id: 'a3', label: 'Director', points: 12 },
                    { id: 'a4', label: 'Head', points: 8 },
                    { id: 'a5', label: 'Manager', points: 4 }
                ],
                capital: [
                    { id: 'c1', label: 'Confirmed budget or formal project in place', points: 20 },
                    { id: 'c2', label: 'No budget / Uncertain', points: 0 }
                ],
                timeline: [
                    { id: 't1', label: '0 to 3 months', points: 25 },
                    { id: 't2', label: '3 to 6 months', points: 15 },
                    { id: 't3', label: '6 to 12 months', points: 5 },
                    { id: 't4', label: 'Over 12 months / No clear timeline', points: 0 }
                ]
            };

            const metrics = useMemo(() => {
                let total = 0;
                Object.keys(selections).forEach(key => {
                    if (selections[key]) total += pactData[key].find(o => o.id === selections[key]).points;
                });

                let tier = { label: 'Incomplete', color: 'text-gray-400', bg: 'bg-gray-50' };
                if (selections.pain === 'p2') tier = { label: '❌ DISQUALIFIED', color: 'text-red-700', bg: 'bg-red-50' };
                else if (selections.pain === 'p1') {
                    if (total >= 90) tier = { label: '🚀 SQL TIER 1: Slam Dunk', color: 'text-blue-900', bg: 'bg-blue-50' };
                    else if (total >= 75) tier = { label: '🔥 SQL TIER 2: Hot Lead', color: 'text-orange-700', bg: 'bg-orange-50' };
                    else if (total >= 56) tier = { label: '📈 SQL TIER 3: Active Project', color: 'text-blue-700', bg: 'bg-blue-50' };
                    else if (total >= 44) tier = { label: '🌱 SQL TIER 4: Early Stage', color: 'text-emerald-700', bg: 'bg-emerald-50' };
                    else if (total >= 39) tier = { label: '📞 Connected Meeting (CM)', color: 'text-slate-700', bg: 'bg-slate-100' };
                    else tier = { label: '⚠️ LOW PRIORITY', color: 'text-gray-600', bg: 'bg-gray-50' };
                }
                return { total, tier };
            }, [selections]);

            return (
                <div className="min-h-screen pb-10">
                    <nav className="bg-[#0F172A] text-white py-4 px-8 shadow-md mb-8">
                        <h1 className="text-xl font-bold tracking-tighter uppercase italic">PACT <span className="font-light text-slate-400 italic">Simulator</span></h1>
                    </nav>
                    
                    <div className="max-w-5xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2 space-y-6">
                            {Object.entries(pactData).map(([key, options]) => (
                                <div key={key} className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                                    <div className="bg-[#0F172A] px-6 py-3 text-white text-xs font-bold uppercase tracking-widest">
                                        Category: {key}
                                    </div>
                                    <div className="divide-y divide-slate-100">
                                        {options.map(opt => (
                                            <div key={opt.id} 
                                                 onClick={() => setSelections(s => ({...s, [key]: opt.id}))}
                                                 className={`p-4 flex justify-between items-center cursor-pointer transition-all ${selections[key] === opt.id ? 'bg-blue-50 border-l-4 border-blue-600' : 'hover:bg-slate-50 border-l-4 border-transparent'}`}>
                                                <span className="text-sm font-medium text-slate-700">{opt.label}</span>
                                                <span className="text-xs font-bold text-slate-400">{opt.points} PTS</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="space-y-6">
                            <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 sticky top-10">
                                <div className="p-8 bg-[#0F172A] text-center text-white">
                                    <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Total Score</p>
                                    <h2 className="text-7xl font-black">{metrics.total}</h2>
                                </div>
                                <div className={`p-6 text-center border-b font-bold uppercase tracking-tight ${metrics.tier.bg} ${metrics.tier.color}`}>
                                    {metrics.tier.label}
                                </div>
                                <div className="p-4 bg-slate-50">
                                    <button onClick={() => setSelections({pain:null, authority:null, capital:null, timeline:null})} className="w-full py-2 bg-slate-800 text-white text-[10px] font-bold uppercase rounded hover:bg-black transition-colors">Reset Calculation</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
